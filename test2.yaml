base: "https://data.europarl.europa.eu/def/rop-core#"

prefixes:
      skos: http://www.w3.org/2004/02/skos/core#
      dc: http://purl.org/dc/terms/
      rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
      xsd: http://www.w3.org/2001/XMLSchema#

sheets:
  - name: ConceptScheme
    rules:
      label_fr: skos:prefLabel@fr
      label_en: skos:prefLabel@fr
      date_creation: dc:created^^xsd:date
      date_last_modification: dc:modified^^xsd:dateTime
      type: rdf:type

  - name: Concept
    rules:
      label_fr: skos:prefLabel@fr
      synonyms_fr: skos:altLabel@fr(separator=";")
      ConceptScheme_URI: skos:inScheme
      type: rdf:type
      date_creation: dc:created^^xsd:dateTime
      date_last_modification: dc:modified^^xsd:dateTime
      code: skos:notation
      label_en: skos:prefLabel@en
      synonyms_en: skos:altLabel@fr(separator=";")
      label_de: skos:prefLabel@de
      synonyms_de: skos:altLabel@de(separator=";")
      label_it: skos:prefLabel@it
      synonyms_it: skos:altLabel@it(separator=";")
      definition_en: skos:definition@en
      editorial_note_en: skos:editorialNote@en